name: Full Stack CI/CD Pipeline (GHCR Flow)

on:
  push:
    branches:
      - "main"
      - "develop"
      - "chore/test-cicd-pipeline"

env:
  REGISTRY: ghcr.io
  # Tự động lấy tên repo (vd: username/vinabooking) chuyển thành chữ thường
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------
  # JOB 1: THỢ XÂY BACKEND (Chạy trên Cloud xịn của GitHub)
  # -------------------------------------------------------------
  build-push-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Cấp quyền cho nó đẩy Image lên GHCR
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase Repo Name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY@L}" >> $GITHUB_ENV
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Token có sẵn, đéo cần setup

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./API/monolith-service
          push: true
          # Gắn mác cho cục hàng: ghcr.io/username/repo/backend:latest
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest

  # -------------------------------------------------------------
  # JOB 2: THỢ XÂY FRONTEND (Chạy trên Cloud xịn của GitHub)
  # -------------------------------------------------------------
  build-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase Repo Name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY@L}" >> $GITHUB_ENV
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./UI
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest

  # -------------------------------------------------------------
  # JOB 3: THẰNG HƯỞNG THỤ (Chạy trên Home Server mạng lag)
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Home Server
    needs: [build-push-backend, build-push-frontend]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chore/test-cicd-pipeline') && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Checkout code (Chỉ lấy docker-compose về)
        uses: actions/checkout@v4

      - name: Generate .env files
        run: |
          echo "${{ secrets.ENV_PROD_BACKEND }}" > ./API/monolith-service/.env.prod
          echo "${{ secrets.ENV_PROD_FRONTEND }}" > ./UI/.env.prod

      # Ép con Home Server đăng nhập vào kho chứa Image của GitHub
      - name: Log in to GHCR on Home Server
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Deploy with Docker Compose (Không có chữ --build)
        run: |
          # 1. Kéo "đồ ăn đã nấu chín" về (Cực nhẹ, đéo cần build C++)
          docker compose pull

          # 2. Úm ba la xì bùa, chạy lên!
          MODE=prod docker compose --env-file ./API/monolith-service/.env.prod up -d

      - name: Clean up rác
        run: docker image prune -a -f
