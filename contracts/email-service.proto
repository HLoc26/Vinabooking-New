syntax = "proto3";

package email;

// ========== SERVICE ==========
service EmailService {
  // Sends an email using the configured SMTP provider (e.g., Gmail)
  rpc SendMail (SendMailRequest) returns (SendMailResponse);
}

// ========== REQUEST ==========
message SendMailRequest {
  // One or more recipient email addresses
  repeated string to = 1;

  string subject = 2;   // Email subject
  string message = 3;   // Plain text content
  string html = 4;      // Optional HTML content
}

// ========== RESPONSE ==========
message SendMailResponse {
  bool success = 1;
  SentMessageInfo data = 2;
  string error = 3;
}

// ========== SENT MESSAGE INFO ==========
message SentMessageInfo {
  Envelope envelope = 1;
  string messageId = 2;
  repeated string accepted = 3;
  repeated string rejected = 4;
  repeated string pending = 5;
  string response = 6;
}

// ========== ENVELOPE ==========
message Envelope {
  string from = 1;
  repeated string to = 2;
}
